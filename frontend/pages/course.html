<section class="page-section">
  <div class="card" style="padding: 22px">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">Courses</h3>
        <p class="text-muted mb-0">Course names, durations and total fees</p>
      </div>
      <button id="addCourseButton" data-permission="courses.add" class="btn btn-primary d-none" type="button">
        Add Course
      </button>
    </div>
    <div id="coursePageMessage" class="alert d-none mb-3" role="alert"></div>
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Course Name</th>
            <th>Course Duration</th>
            <th>Total Fee</th>
            <th>Status</th>
            <th class="course-admin-column d-none">Actions</th>
          </tr>
        </thead>
        <tbody id="courseTableBody">
          <tr>
            <td colspan="6" class="text-center text-muted py-4">
              Loading courses...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="courseForm">
      <div class="modal-header">
        <h5 class="modal-title" id="courseModalTitle">Add Course</h5>
        <button type="button" class="btn-close" id="closeCourseModal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="courseId" />
        <div class="mb-3">
          <label class="form-label" for="courseName">Course Name</label
          ><input class="form-control" id="courseName" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="courseDuration">Duration</label
          ><input class="form-control" id="courseDuration" required />
        </div>
        <div>
          <label class="form-label" for="courseTotalFee">Total Fee</label
          ><input
            class="form-control"
            id="courseTotalFee"
            type="number"
            min="0"
            step="0.01"
            required
          />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" id="cancelCourseButton">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="saveCourseButton">
          Save Course
        </button>
      </div>
    </form>
  </div>
</div>
